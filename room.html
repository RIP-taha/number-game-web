<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتاق بازی - Number Game</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">🎮 NUMBER GAME</div>
        <div class="nav-links">
            <a href="lobby.html">بازگشت به لابی</a>
            <span id="nav-username" class="nav-user">👤 کاربر</span>
        </div>
    </nav>

    <main class="auth-page">
        <div class="auth-card" style="max-width: 600px; padding: 40px;">
            <h2 style="color: #00d9ff; text-align: center; margin-bottom: 30px; font-size: 2rem; text-shadow: 0 0 15px rgba(0,217,255,0.4);">👥 اتاق بازی</h2>
            
            <!-- تنظیمات ساخت اتاق (فقط برای سازنده) -->
            <div id="room-settings" class="hidden">
                <div class="bot-config">
                    <div class="config-group">
                        <label>حداکثر تعداد بازیکن (۲ تا ۴)</label>
                        <div class="slider-container">
                            <input type="range" id="max-players" min="2" max="4" value="2" oninput="updateSliderValue('max-players', 'players-val')">
                            <span class="slider-value" id="players-val">2</span>
                        </div>
                    </div>
                    
                    <div class="config-group">
                        <label>تعداد بات‌ها (۰ تا ۳)</label>
                        <div class="slider-container">
                            <input type="range" id="bot-count-room" min="0" max="3" value="0" oninput="updateSliderValue('bot-count-room', 'bots-val')">
                            <span class="slider-value" id="bots-val">0</span>
                        </div>
                    </div>
                    
                    <div class="config-group">
                        <label>سطح بات‌ها</label>
                        <select id="bot-difficulty-room" class="custom-select">
                            <option value="easy">🟢 آسان</option>
                            <option value="medium" selected>🟡 متوسط</option>
                            <option value="hard">🔴 سخت</option>
                        </select>
                    </div>
                    
                    <button class="btn-primary" onclick="createRoomWithSettings()" style="width: 100%; margin-top: 25px; padding: 15px; font-size: 1.1rem;">ساخت اتاق</button>
                    <button class="btn-secondary" onclick="location.href='lobby.html'" style="width: 100%; margin-top: 15px; padding: 12px;">انصراف</button>
                </div>
            </div>

            <!-- بخش ورود به اتاق (اگه کد نداریم) -->
            <div id="join-section" class="hidden">
                <p style="text-align: center; color: #8888aa; margin-bottom: 20px;">کد اتاق را وارد کنید:</p>
                <input type="text" id="join-room-code" placeholder="مثلاً ABC123" maxlength="6" style="text-align: center; letter-spacing: 8px; font-size: 1.8rem; font-weight: bold; margin-bottom: 25px; background-color: #16213e; border: 2px solid #00d9ff; border-radius: 12px; color: #fff; padding: 15px; width: 100%; outline: none;">
                <button class="btn-primary" onclick="joinRoomFromPage()" style="width: 100%; padding: 15px; font-size: 1.1rem;">ورود به اتاق</button>
                <button class="btn-secondary" onclick="location.href='lobby.html'" style="width: 100%; margin-top: 15px; padding: 12px;">انصراف</button>
            </div>

            <!-- بخش اتاق ساخته شده (اگه کد داریم) -->
            <div id="room-section" class="hidden">
                <p style="text-align: center; color: #8888aa; margin-bottom: 15px;">کد اتاق برای دعوت دوستان:</p>
                <div id="room-code-display" style="font-size: 2.5rem; font-weight: bold; color: #ffd700; text-align: center; letter-spacing: 8px; margin-bottom: 30px; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);">-----</div>
                
                <h3 style="color: #00d9ff; margin-bottom: 15px; text-align: center;">بازیکنان حاضر:</h3>
                <ul id="player-list" style="list-style: none; padding: 0; color: #e0e0e0; font-size: 1.1rem; margin-bottom: 30px; display: flex; flex-direction: column; gap: 10px;">
                    <li style="padding: 12px; background: #16213e; border-radius: 8px; text-align: center;">در حال اتصال...</li>
                </ul>
                
                <button id="start-game-btn" class="btn-primary hidden" onclick="startMultiplayerGame()" style="width: 100%; margin-bottom: 15px; background-color: #00ff88; color: #0f0f1a; font-weight: bold; padding: 15px; font-size: 1.1rem;">🚀 شروع بازی</button>

                <button class="btn-secondary" onclick="location.href='lobby.html'" style="width: 100%; padding: 12px;">خروج از اتاق</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>🎮 Number Game | ورژن 1.0.0</p>
            <p>ساخته شده با ❤️ توسط تیم Number Game</p>
        </div>
    </footer>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="particles.js"></script>
    <script src="script.js?v=13"></script>
</body>
</html>
