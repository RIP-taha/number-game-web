<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتاق بازی - Number Game</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">🎮 NUMBER GAME</div>
        <div class="nav-links">
            <a href="lobby.html">بازگشت به لابی</a>
            <span id="nav-username" class="nav-user">👤 کاربر</span>
        </div>
    </nav>
    <main class="auth-page">
        <div class="auth-card" style="max-width: 600px;">
            <h2 style="color: #00d9ff; text-align: center; margin-bottom: 20px;">👥 اتاق بازی</h2>
            <div id="room-settings" class="hidden" style="margin-bottom: 20px;">
                <label>حداکثر تعداد بازیکن (۲ تا ۴):</label>
                <input type="number" id="max-players" min="2" max="4" value="2" style="margin-bottom: 15px;">
                <label>تعداد بات‌ها (۰ تا ۳):</label>
                <input type="number" id="bot-count" min="0" max="3" value="0" style="margin-bottom: 15px;">
                <label>سطح بات‌ها:</label>
                <select id="bot-difficulty" style="margin-bottom: 15px;">
                    <option value="easy">🟢 آسان</option>
                    <option value="medium" selected>🟡 متوسط</option>
                    <option value="hard">🔴 سخت</option>
                </select>
                <button class="btn-primary" onclick="createRoomWithSettings()" style="width: 100%; margin-bottom: 10px;">ساخت اتاق</button>
            </div>
            <div id="join-section">
                <p style="text-align: center; color: #8888aa; margin-bottom: 15px;">کد اتاق را وارد کنید:</p>
                <input type="text" id="join-room-code" placeholder="مثلاً ABC123" maxlength="6" style="text-align: center; letter-spacing: 5px; font-size: 1.5rem; margin-bottom: 15px;">
                <button class="btn-primary" onclick="joinRoomFromPage()" style="width: 100%;">ورود به اتاق</button>
            </div>
            <div id="room-section" class="hidden">
                <p style="text-align: center; color: #8888aa; margin-bottom: 15px;">کد اتاق برای دعوت دوستان:</p>
                <div id="room-code-display" style="font-size: 2.5rem; font-weight: bold; color: #ffd700; text-align: center; letter-spacing: 5px; margin-bottom: 20px;">-----</div>
                <h3 style="color: #00d9ff; margin-bottom: 10px;">بازیکنان حاضر:</h3>
                <ul id="player-list" style="list-style: none; padding: 0; color: #e0e0e0; font-size: 1.1rem; margin-bottom: 20px;">
                    <li style="padding: 10px; background: #16213e; margin-bottom: 5px; border-radius: 8px;">در حال اتصال...</li>
                </ul>
                <button id="start-game-btn" class="btn-primary hidden" onclick="startMultiplayerGame()" style="width: 100%; margin-bottom: 15px; background-color: #00ff88; color: #0f0f1a;">🚀 شروع بازی</button>
                <button class="btn-secondary" onclick="location.href='lobby.html'" style="width: 100%;">خروج از اتاق</button>
            </div>
        </div>
    </main>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="particles.js"></script>
    <script src="script.js?v=9"></script>
</body>
</html>
