<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات بازی با بات - Number Game</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">🎮 NUMBER GAME</div>
        <div class="nav-links">
            <a href="lobby.html">بازگشت به لابی</a>
            <span id="nav-username" class="nav-user">👤 کاربر</span>
            <a href="#" onclick="logout()" class="btn-nav">خروج</a>
        </div>
    </nav>

    <main class="auth-page"> <!-- از استایل auth-page استفاده می‌کنیم که وسط‌چین باشه -->
        <div class="auth-card" style="max-width: 500px;">
            <h2 style="color: #00d9ff; text-align: center; margin-bottom: 25px;">🤖 تنظیمات بازی با بات</h2>
            
            <div class="bot-config">
                <label>تعداد دست (۱ تا ۱۰)</label>
                <input type="number" id="bot-rounds" min="1" max="10" value="5">

                <label>تعداد بات (۱ تا ۳)</label>
                <input type="number" id="bot-count" min="1" max="3" value="2">

                <label>سطح سختی بات‌ها</label>
                <select id="bot-difficulty">
                    <option value="easy">🟢 آسان</option>
                    <option value="medium" selected>🟡 متوسط</option>
                    <option value="hard">🔴 سخت</option>
                </select>

                <button class="btn-primary" onclick="startBotGame()" style="width: 100%; margin-top: 30px;">شروع بازی</button>
                <button class="btn-secondary" onclick="location.href='lobby.html'" style="width: 100%; margin-top: 15px; padding: 12px;">انصراف</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>🎮 Number Game | ورژن 1.0.0</p>
            <p>ساخته شده با ❤️ توسط تیم Number Game</p>
        </div>
    </footer>

    <script src="script.js?v=5"></script>
</body>
</html>
