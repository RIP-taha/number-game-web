<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">🎮 NUMBER GAME</div>
        <div class="nav-links">
            <a href="index.html">خانه</a>
            <a href="rules.html">راهنما</a>
            <a href="login.html" class="btn-nav">ورود / ثبت‌نام</a>
        </div>
    </nav>

    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')" id="tab-login">ورود</button>
                <button class="auth-tab" onclick="switchTab('register')" id="tab-register">ثبت‌نام</button>
            </div>

            <form id="login-form" class="auth-form">
                <h2>ورود به حساب</h2>

                <label>نام کاربری</label>
                <input type="text" id="login-username" placeholder="نام کاربری خود را وارد کنید" required>

                <label>رمز عبور</label>
                <input type="password" id="login-password" placeholder="رمز عبور خود را وارد کنید" required>

                <button type="submit" class="btn-primary">ورود</button>

                <p class="auth-switch">حساب نداری؟ <a href="#" onclick="switchTab('register')">ثبت‌نام کن</a></p>
            </form>

            <form id="register-form" class="auth-form hidden">
                <h2>ساخت حساب جدید</h2>

                <label>نام کاربری</label>
                <input type="text" id="register-username" placeholder="یه نام کاربری انتخاب کن" required>

                <label>ایمیل</label>
                <input type="email" id="register-email" placeholder="ایمیل خود را وارد کنید" required>

                <label>رمز عبور</label>
                <input type="password" id="register-password" placeholder="حداقل ۸ کاراکتر، شامل حرف بزرگ، کوچیک، عدد و کاراکتر خاص" required>

                <div class="password-strength" id="password-strength">
                    <div class="strength-bar" id="strength-bar"></div>
                </div>
                <p class="strength-text" id="strength-text"></p>

                <label>تکرار رمز عبور</label>
                <input type="password" id="register-password2" placeholder="رمز عبور را دوباره وارد کنید" required>

                <button type="submit" class="btn-primary">ثبت‌نام</button>

                <p class="auth-switch">حساب داری؟ <a href="#" onclick="switchTab('login')">ورود کن</a></p>
            </form>

            <p id="auth-message" class="auth-message"></p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>🎮 Number Game | ورژن 1.0.0</p>
            <p>ساخته شده با ❤️ توسط تیم Number Game</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
